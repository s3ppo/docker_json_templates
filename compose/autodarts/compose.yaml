services:
  autodarts:
    image: michvllni/autodarts:latest
    container_name: autodarts
    restart: unless-stopped
    network_mode: host
    devices:
      - source: /dev/v4l/by-path/pci-0000:00:15.0-usb-0:3:1.0-video-index0
        target: /dev/video0
        permissions: "rwm"
      - source: /dev/v4l/by-path/pci-0000:00:15.0-usb-0:1.4:1.0-video-index0
        target: /dev/video2
        permissions: "rwm"
      - source: /dev/v4l/by-path/pci-0000:00:15.0-usb-0:1.3:1.0-video-index0
        target: /dev/video4
        permissions: "rwm"
    volumes:
      - ./config:/root/.config/autodarts